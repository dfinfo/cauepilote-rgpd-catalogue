# Catalogue central des traitements génériques de CAUE'PILOTE.
#
# Lu directement par toutes les apps (cache d'une heure) : une modification poussée sur master est en ligne
# partout, sans redéploiement. Un fichier invalide est ignoré par les apps, qui gardent le dernier valide.
#
# processor  : le sous-traitant (df-info), repris en en-tête du registre de chaque app.
# recipients : destinataires génériques, cités par les traitements (treatment_recipients).
# treatments : traitements génériques. Un traitement ne figure au registre d'une app que si une de ses
#              données le cite (facette `treatments`, constante GenericTreatmentCode du rgpd-bundle).
# Les clés ne changent jamais. Toutes les rubriques sont obligatoires.

processor:
    processor_label: df-info
    processor_txt: |
        df-info, éditeur et hébergeur de CAUE'PILOTE, sous-traitant au sens de l'article 28 du RGPD.
        Denis Fohl, 214 impasse des Taillades, 24220 Coux et Bigaroque - Mouzens. Contact : contact@cauepilote.com.

recipients:
    personnel_caue:
        recipient_label: Personnel habilité du CAUE
        recipient_txt: Salariés du CAUE dont les fonctions le justifient, selon les droits attribués dans l'application.
        recipient_outside_eu: false

    dfinfo:
        recipient_label: df-info
        recipient_txt: Éditeur de CAUE'PILOTE, sous-traitant du CAUE pour l'hébergement, le support et la maintenance de l'application. France.
        recipient_outside_eu: false

    hebergement:
        recipient_label: Hébergeurs des serveurs
        recipient_txt: Hébergeurs des serveurs de production et de sauvegarde (Ikoula, OVHcloud, Online / Scaleway), sous-traitants ultérieurs de df-info. France et Union européenne.
        recipient_outside_eu: false

    brevo:
        recipient_label: Brevo
        recipient_txt: Relais d'envoi des emails envoyés par l'application, et des SMS de rappel de rendez-vous quand l'application l'utilise pour les SMS, sous-traitant ultérieur de df-info. Union européenne.
        recipient_outside_eu: false

    smsapi:
        recipient_label: SMSAPI (LINK Mobility)
        recipient_txt: Envoi des SMS envoyés par l'application, sous-traitant ultérieur de df-info. Union européenne.
        recipient_outside_eu: false

    google_maps:
        recipient_label: Google Maps (Google Ireland Ltd)
        recipient_txt: Cartographie et géolocalisation des adresses saisies, sous-traitant ultérieur de df-info. Union européenne et États-Unis, transfert encadré par le cadre de protection des données UE–États-Unis (décision d'adéquation du 10 juillet 2023) et les clauses contractuelles types de la Commission européenne.
        recipient_outside_eu: true

    google_calendar:
        recipient_label: Google Calendar (Google Ireland Ltd)
        recipient_txt: Synchronisation des agendas, sous-traitant ultérieur de df-info. Union européenne et États-Unis, transfert encadré par le cadre de protection des données UE–États-Unis (décision d'adéquation du 10 juillet 2023) et les clauses contractuelles types de la Commission européenne.
        recipient_outside_eu: true

    # Outils d'emailing des CAUE (groupes de diffusion de l'annuaire synchronisés depuis l'application) : comptes du
    # CAUE, sous-traitants du CAUE et non de df-info. Chaque CAUE coche le sien dans le complément du traitement
    # « Gestion des contacts et des partenaires » (aucun traitement générique ne les cite).
    emailing_brevo:
        recipient_label: Brevo (outil d'emailing du CAUE)
        recipient_txt: Envoi des lettres d'information et invitations du CAUE aux groupes de diffusion de l'annuaire, synchronisés depuis l'application vers le compte Brevo du CAUE. Sous-traitant du CAUE. Union européenne.
        recipient_outside_eu: false

    emailing_mailjet:
        recipient_label: Mailjet (outil d'emailing du CAUE)
        recipient_txt: Envoi des lettres d'information et invitations du CAUE aux groupes de diffusion de l'annuaire, synchronisés depuis l'application vers le compte Mailjet du CAUE. Sous-traitant du CAUE. Union européenne.
        recipient_outside_eu: false

    emailing_mailchimp:
        recipient_label: Mailchimp (outil d'emailing du CAUE)
        recipient_txt: Envoi des lettres d'information et invitations du CAUE aux groupes de diffusion de l'annuaire, synchronisés depuis l'application vers le compte Mailchimp du CAUE. Sous-traitant du CAUE (Intuit, États-Unis). Transfert hors de l'Union européenne, encadré par le cadre de protection des données UE–États-Unis (décision d'adéquation du 10 juillet 2023) et les clauses contractuelles types du contrat de traitement de Mailchimp.
        recipient_outside_eu: true

treatments:
    gestion_personnel:
        treatment_label: Gestion du personnel
        treatment_txt: |
            Description : fiche des salariés du CAUE (identité, coordonnées, contrat, données administratives), demandes de congés et leur validation, absences, compteurs et soldes, saisie des temps de travail, plan de charge, ordres de mission et frais.

            Finalité : gestion administrative du personnel et organisation du travail :
            - tenue du dossier des salariés ;
            - demandes, validation et suivi des congés et des absences, calcul des droits et des soldes ;
            - décompte du temps de travail, répartition par activité, plan de charge ;
            - ordres de mission et remboursement des frais ;
            - statistiques et bilans d'activité, sur des données agrégées.

            Base légale : exécution du contrat de travail (art. 6.1.b du RGPD) et respect des obligations légales de l'employeur (art. 6.1.c : Code du travail, durée du travail et congés). Les absences peuvent révéler des données de santé (arrêt maladie, accident du travail, temps partiel thérapeutique, enfant malade…) : leur traitement relève de l'exception de l'art. 9.2.b du RGPD (obligations et droits de l'employeur en matière de droit du travail).

            Source des données : le salarié lui-même et le service du personnel du CAUE.

            Décision automatisée, profilage : non.

            Mesures de sécurité : une base de données propre à chaque CAUE ; accès à l'application par identifiant et mot de passe, droits attribués par rôle (données RH réservées aux gestionnaires du personnel, type de congé masqué par défaut dans le calendrier des congés) ; échanges chiffrés (HTTPS) ; accès aux serveurs par clé SSH seule, pare-feu, blocage des tentatives d'intrusion, mises à jour de sécurité automatiques ; deux sauvegardes quotidiennes chez deux hébergeurs distincts ; journal des accès ; accès aux données limité au personnel habilité de df-info, pour le support et la maintenance.

            Analyse d'impact (AIPD) : non requise. Le traitement de données de santé des salariés, limité à la gestion des absences, ne relève d'aucun critère de la liste de la CNIL des traitements soumis à analyse d'impact (pas de traitement à grande échelle, pas de profilage, pas de surveillance systématique de l'activité).
        treatment_recipients: [personnel_caue, dfinfo, hebergement, brevo]

    gestion_contacts:
        treatment_label: Gestion des contacts et des partenaires
        treatment_txt: |
            Description : annuaire des interlocuteurs du CAUE (élus, agents des collectivités et des administrations, professionnels, partenaires, adhérents) et des organismes auxquels ils appartiennent : coordonnées, fonctions, relations avec les organismes, groupes de diffusion, fichiers importés.

            Finalité : identifier et joindre les interlocuteurs du CAUE dans l'exercice de ses missions :
            - tenue de l'annuaire des contacts et des organismes, de leurs fonctions et de leurs relations ;
            - invitations, informations et diffusion des publications du CAUE ;
            - gestion des adhérents et des instances (assemblée générale, conseil d'administration, bureau) ;
            - statistiques et bilans d'activité, sur des données agrégées.

            Base légale : mission d'intérêt public (art. 6.1.e du RGPD) confiée aux CAUE par la loi n° 77-2 du 3 janvier 1977 sur l'architecture, pour les relations avec les collectivités, les administrations et les partenaires de ses missions ; intérêt légitime du CAUE (art. 6.1.f) pour la gestion de ses adhérents et de ses instances ; consentement (art. 6.1.a) pour l'envoi de lettres d'information aux personnes qui n'en sont pas destinataires au titre de leurs fonctions.

            Source des données : la personne elle-même, l'organisme auquel elle appartient, les sources publiques (annuaires des collectivités et des administrations), les fichiers importés par le CAUE.

            Décision automatisée, profilage : non.

            Mesures de sécurité : une base de données propre à chaque CAUE ; accès à l'application par identifiant et mot de passe, droits attribués par rôle ; échanges chiffrés (HTTPS) ; accès aux serveurs par clé SSH seule, pare-feu, blocage des tentatives d'intrusion, mises à jour de sécurité automatiques ; deux sauvegardes quotidiennes chez deux hébergeurs distincts ; surveillance de la disponibilité toutes les 3 minutes ; journal des accès ; accès aux données limité au personnel habilité de df-info, pour le support et la maintenance.

            Analyse d'impact (AIPD) : non requise. Le traitement ne relève d'aucun critère de la liste de la CNIL des traitements soumis à analyse d'impact (pas de données sensibles, pas de profilage, pas de décision automatisée, pas de surveillance systématique).
        treatment_recipients: [personnel_caue, dfinfo, hebergement, brevo]

    conseil_particuliers:
        treatment_label: Conseil architectural aux particuliers
        treatment_txt: |
            Description : accueil des particuliers qui ont un projet de construction, de rénovation ou d'aménagement, prise de rendez-vous, conseil gratuit par un architecte conseiller, suivi du projet et des documents déposés.

            Finalité : conseiller les particuliers sur la qualité architecturale, urbaine, paysagère et environnementale de leur projet :
            - prise de rendez-vous et envoi des confirmations ;
            - conduite du conseil et rédaction de la fiche de conseil ;
            - envoi du compte rendu au demandeur et aux destinataires qu'il désigne ;
            - statistiques et bilans d'activité, sur des données anonymisées ou agrégées.

            Base légale : mission d'intérêt public (art. 6.1.e du RGPD), confiée aux CAUE par l'article 7 de la loi n° 77-2 du 3 janvier 1977 sur l'architecture : fournir aux personnes qui désirent construire les informations, les orientations et les conseils propres à assurer la qualité architecturale des constructions et leur bonne insertion dans le site.

            Source des données : la personne elle-même.

            Décision automatisée, profilage : non.

            Mesures de sécurité : une base de données propre à chaque CAUE ; accès à l'application par identifiant et mot de passe, droits attribués par rôle ; échanges chiffrés (HTTPS) ; accès aux serveurs par clé SSH seule, pare-feu, blocage des tentatives d'intrusion, mises à jour de sécurité automatiques ; deux sauvegardes quotidiennes chez deux hébergeurs distincts ; surveillance de la disponibilité toutes les 3 minutes ; accès aux données limité au personnel habilité de df-info, pour le support et la maintenance.

            Analyse d'impact (AIPD) : non requise. Le traitement ne relève d'aucun critère de la liste de la CNIL des traitements soumis à analyse d'impact (pas de données sensibles collectées à grande échelle, pas de profilage, pas de décision automatisée, pas de surveillance systématique).
        treatment_recipients: [personnel_caue, dfinfo, hebergement, brevo]

    demandes_droits:
        treatment_label: Gestion des demandes d'exercice des droits des personnes
        treatment_txt: |
            Description : enregistrement et suivi des demandes que les personnes adressent au CAUE pour exercer leurs droits sur leurs données personnelles (accès, rectification, effacement, limitation, portabilité, opposition, retrait du consentement), vérification de leur identité, réponse dans les délais.

            Finalité : répondre aux demandes dans le délai d'un mois (prolongeable de deux mois) et pouvoir prouver la réponse apportée.

            Base légale : obligation légale (art. 6.1.c du RGPD), articles 12 à 22 du RGPD.

            Source des données : la personne elle-même ou son représentant.

            Décision automatisée, profilage : non.

            Mesures de sécurité : celles de l'application (accès par identifiant et mot de passe, droits par rôle, échanges chiffrés, sauvegardes) ; demandes et pièces jointes réservées aux contributeurs RGPD du CAUE, pièces jointes rangées hors de l'espace web public.

            Analyse d'impact (AIPD) : non requise.
        treatment_recipients: [personnel_caue, dfinfo, hebergement]
